<rect x="70.0" y="20.0" width="1530.0" height="85.0" rx="12" fill="#EDE9FE" stroke="#c4bfd5"/>
<text x="835.0" y="56.5" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">4 网络测试：按检查维度提供证据</text>
<text x="835.0" y="79.0" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">实线为上下文、观测或结果消费；虚线为负载与观测关联。层间调度仍待确认。</text>
<rect x="630.0" y="160.0" width="390.0" height="140.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="825.0" y="212.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">4.1 确认准入并冻结测试计划</text>
<text x="825.0" y="235.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">配置与映射有效、网络就绪</text>
<text x="825.0" y="257.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">目标／路径／档位／版本／资源</text>
<rect x="90.0" y="410.0" width="250.0" height="135.0" rx="12" fill="#EFF6FF" stroke="#c4bfd5"/>
<text x="215.0" y="482.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">4.2 检查链路、速率与光模块</text>
<rect x="400.0" y="410.0" width="250.0" height="135.0" rx="12" fill="#EFF6FF" stroke="#c4bfd5"/>
<text x="525.0" y="482.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">4.3 验证 IP 可达性</text>
<rect x="710.0" y="410.0" width="250.0" height="135.0" rx="12" fill="#EFF6FF" stroke="#c4bfd5"/>
<text x="835.0" y="482.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">4.4 验证 RDMA 写读通路</text>
<rect x="1020.0" y="410.0" width="250.0" height="135.0" rx="12" fill="#EFF6FF" stroke="#c4bfd5"/>
<text x="1145.0" y="482.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">4.5 验证多流负载与热点覆盖</text>
<rect x="1330.0" y="410.0" width="250.0" height="135.0" rx="12" fill="#EFF6FF" stroke="#c4bfd5"/>
<text x="1455.0" y="482.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">4.6 交叉验证无损与拥塞</text>
<rect x="1030.0" y="690.0" width="520.0" height="150.0" rx="12" fill="#FFFBEB" stroke="#c4bfd5"/>
<text x="1290.0" y="747.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">网络侧持续观测</text>
<text x="1290.0" y="770.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">采集来源、规则版本、能力与质量</text>
<text x="1290.0" y="792.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">观测窗口覆盖相关负载；缺测不能补零</text>
<rect x="630.0" y="940.0" width="420.0" height="140.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="840.0" y="992.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">4.7 汇总网络测试并发布证明</text>
<text x="840.0" y="1015.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">必需检查结果＋所需路径覆盖</text>
<text x="840.0" y="1037.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">版本／有效期／批准的豁免</text>
<rect x="80.0" y="1200.0" width="330.0" height="120.0" rx="12" fill="#ECFDF5" stroke="#c4bfd5"/>
<text x="245.0" y="1254.0" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">PASS</text>
<text x="245.0" y="1276.5" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">所需有效证据全PASS且覆盖满足</text>
<rect x="470.0" y="1200.0" width="390.0" height="120.0" rx="12" fill="#FFF1F2" stroke="#c4bfd5"/>
<text x="665.0" y="1242.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">FAIL / BLOCKED</text>
<text x="665.0" y="1265.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">已证明违反判据／必需证明不足</text>
<text x="665.0" y="1287.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">混合结论汇总策略待确认</text>
<rect x="920.0" y="1200.0" width="330.0" height="120.0" rx="12" fill="#F3E8FF" stroke="#c4bfd5"/>
<text x="1085.0" y="1242.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">WAIVED</text>
<text x="1085.0" y="1265.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">适用范围／期限／审批／整改</text>
<text x="1085.0" y="1287.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">不得改写PASS</text>
<rect x="80.0" y="1370.0" width="1470.0" height="90.0" rx="12" fill="#F8FAFC" stroke="#c4bfd5"/>
<text x="815.0" y="1420.25" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">30 秒打流不能单独证明 3600 秒 ECN 规则已验证；未触发规则不能代替网络验收；抽样通过不能外推全路径。</text>
