<rect x="80.0" y="20.0" width="1430.0" height="80.0" rx="12" fill="#EDE9FE" stroke="#c4bfd5"/>
<text x="795.0" y="54.0" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">3.3 核对并确认物理接线</text>
<text x="795.0" y="76.5" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">实线表示已定义的控制或判定分支；虚线表示定向复验回流。</text>
<rect x="80.0" y="160.0" width="290.0" height="130.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="225.0" y="207.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">3.3 开始条件</text>
<text x="225.0" y="230.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">硬件采集与机内拓扑有效</text>
<text x="225.0" y="252.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">端口已建模、配置就绪、邻居可读</text>
<rect x="420.0" y="160.0" width="290.0" height="130.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="565.0" y="219.0" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">3.3.1 确认 GPU–NIC 关系</text>
<text x="565.0" y="241.5" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">保存机内路径与亲和关系版本</text>
<rect x="760.0" y="160.0" width="290.0" height="130.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="905.0" y="219.0" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">3.3.2 采集双侧邻居与 MAC</text>
<text x="905.0" y="241.5" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">主机实测＋交换机回读</text>
<rect x="1100.0" y="160.0" width="290.0" height="130.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="1245.0" y="219.0" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">3.3.3 进行三方比对</text>
<text x="1245.0" y="241.5" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">期望连接 ↔ 主机实测 ↔ 交换机回读</text>
<rect x="1100.0" y="500.0" width="290.0" height="130.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="1245.0" y="559.0" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">3.3.4 交付组长最终确认</text>
<text x="1245.0" y="581.5" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">完整步骤链＋关系版本＋确认记录</text>
<rect x="1100.0" y="800.0" width="290.0" height="130.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="1245.0" y="847.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">3.4 发布已验证映射</text>
<text x="1245.0" y="870.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">所需映射覆盖 100%，无冲突</text>
<text x="1245.0" y="892.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">发布不可变版本</text>
<rect x="750.0" y="480.0" width="280.0" height="140.0" rx="12" fill="#FFFBEB" stroke="#c4bfd5"/>
<text x="890.0" y="532.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">缺任一侧必需证据</text>
<text x="890.0" y="555.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">unknown → BLOCKED</text>
<text x="890.0" y="577.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">不判空匹配成功</text>
<rect x="410.0" y="480.0" width="280.0" height="140.0" rx="12" fill="#FFF1F2" stroke="#c4bfd5"/>
<text x="550.0" y="532.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">明确差异 → 分类故障工单</text>
<text x="550.0" y="555.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">原始证据＋期望/实际</text>
<text x="550.0" y="577.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">不把采集超时直接判线缆坏</text>
<rect x="410.0" y="800.0" width="550.0" height="140.0" rx="12" fill="#EFF6FF" stroke="#c4bfd5"/>
<text x="685.0" y="852.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">0.1 修复与定向复验</text>
<text x="685.0" y="875.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">复验通过后提议关闭，网络工程师／交付组长确认</text>
<text x="685.0" y="897.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">通常回到 3.3.2；拓扑变化先重做 3.2</text>
<rect x="80.0" y="1030.0" width="1430.0" height="130.0" rx="12" fill="#F8FAFC" stroke="#c4bfd5"/>
<text x="795.0" y="1100.25" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">连接确认由本次三方比对产生；3.3.3 局部通过不能代替 3.3.4 最终确认。稳定物理端口在映射发布前已存在。</text>
