<g><rect x="778.0" y="299.0" width="84" height="20" rx="4" fill="white" fill-opacity=".95"/><text x="820.0" y="313.0" text-anchor="middle" fill="#b07920" font-size="12">显式范围重验</text></g>
</g></svg>