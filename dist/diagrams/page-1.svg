<polyline points="850.0,225.0 860,225.0 860,360 940,360 940,355.0 950.0,355.0" fill="none" stroke="#7560a8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="80.0" y="25.0" width="1500.0" height="85.0" rx="12" fill="#EDE9FE" stroke="#c4bfd5"/>
<text x="830.0" y="61.5" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">五步交付与产物依赖</text>
<text x="830.0" y="84.0" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">编号为阅读位置；实线为产物消费。网络与服务器侧按需并行。</text>
<rect x="80.0" y="160.0" width="280.0" height="110.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="220.0" y="209.0" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">1.1 导入物料与连接计划</text>
<text x="220.0" y="231.5" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">建立可引用的稳定对象与期望连接。</text>
<rect x="80.0" y="300.0" width="280.0" height="110.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="220.0" y="337.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">1.2 制定网络实施计划</text>
<text x="220.0" y="360.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">把已经商定的网络方案转换成可执行</text>
<text x="220.0" y="382.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">批次和配置输入。</text>
<rect x="80.0" y="440.0" width="280.0" height="110.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="220.0" y="489.0" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">1.3 检查开通环境</text>
<text x="220.0" y="511.5" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">证明引导、采集和分发依赖可用。</text>
<rect x="80.0" y="580.0" width="280.0" height="110.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="220.0" y="617.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">1.4 开通交换机管理通道</text>
<text x="220.0" y="640.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">使交换机身份可信且具备最小管理能</text>
<text x="220.0" y="662.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">力。</text>
<rect x="80.0" y="720.0" width="280.0" height="110.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="220.0" y="757.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">1.5 预校验网络侧接线</text>
<text x="220.0" y="780.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">检查当前可观测网络连接，保留尚未</text>
<text x="220.0" y="802.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">出现的服务器观测缺口。</text>
<rect x="390.0" y="580.0" width="280.0" height="110.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="530.0" y="629.0" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">1.6 应用并核对网络配置</text>
<text x="530.0" y="651.5" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">证明批准配置已在交换机生效。</text>
<rect x="390.0" y="790.0" width="280.0" height="110.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="530.0" y="827.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">1.7 检查网络健康与无损能力</text>
<text x="530.0" y="850.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">提供网络准入事实和可被测试消费的</text>
<text x="530.0" y="872.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">观测证据。</text>
<rect x="80.0" y="1000.0" width="280.0" height="110.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="220.0" y="1049.0" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">1.8 验收并导出网络交付包</text>
<text x="220.0" y="1071.5" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">生成可核对的网络交付证据包。</text>
<rect x="570.0" y="170.0" width="280.0" height="110.0" rx="12" fill="#EFF6FF" stroke="#c4bfd5"/>
<text x="710.0" y="208.9" text-anchor="middle" font-size="14" font-weight="650" fill="#25223d">2.2 收集装机硬件信息</text>
<text x="710.0" y="229.9" text-anchor="middle" font-size="14" font-weight="400" fill="#25223d">将 BMC 与操作系统看到的硬件分别留存</text>
<text x="710.0" y="250.9" text-anchor="middle" font-size="14" font-weight="400" fill="#25223d">，给验机提供可追溯的原始清单。</text>
<rect x="950.0" y="160.0" width="280.0" height="110.0" rx="12" fill="#EFF6FF" stroke="#c4bfd5"/>
<text x="1090.0" y="197.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">2.1 安装系统并建立 SSH 互信</text>
<text x="1090.0" y="220.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">把裸机变成身份已确认、可执行采集</text>
<text x="1090.0" y="242.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">的服务器。</text>
<rect x="950.0" y="300.0" width="280.0" height="110.0" rx="12" fill="#EFF6FF" stroke="#c4bfd5"/>
<text x="1090.0" y="337.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">3.1 核验硬件与系统信息</text>
<text x="1090.0" y="360.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">记录硬件与系统事实，为拓扑和线序</text>
<text x="1090.0" y="382.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">提供输入。</text>
<rect x="950.0" y="440.0" width="280.0" height="110.0" rx="12" fill="#EFF6FF" stroke="#c4bfd5"/>
<text x="1090.0" y="477.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">3.2 验证机内 GPU–NIC 拓扑</text>
<text x="1090.0" y="500.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">证明GPU-NIC内部关系符合独立预期</text>
<text x="1090.0" y="522.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">。</text>
<rect x="950.0" y="620.0" width="280.0" height="110.0" rx="12" fill="#EFF6FF" stroke="#c4bfd5"/>
<text x="1090.0" y="657.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">3.3 核对并确认物理接线</text>
<text x="1090.0" y="680.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">证明期望物理端口连接与两侧实测一</text>
<text x="1090.0" y="702.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">致，并获最终确认。</text>
<rect x="950.0" y="790.0" width="280.0" height="110.0" rx="12" fill="#EFF6FF" stroke="#c4bfd5"/>
<text x="1090.0" y="827.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">3.4 发布已验证映射</text>
<text x="1090.0" y="850.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">发布所有后续配置和定位使用的同一</text>
<text x="1090.0" y="872.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">映射版本。</text>
<rect x="950.0" y="960.0" width="280.0" height="110.0" rx="12" fill="#EFF6FF" stroke="#c4bfd5"/>
<text x="1090.0" y="997.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">3.5 应用并验证服务器基线配置</text>
<text x="1090.0" y="1020.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">把确认后的关系转换为真实服务器配</text>
<text x="1090.0" y="1042.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">置并验证。</text>
<rect x="950.0" y="1120.0" width="280.0" height="110.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="1090.0" y="1157.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">4.1 确认准入并冻结测试计划</text>
<text x="1090.0" y="1180.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">固定本次测试范围和证明义务，避免</text>
<text x="1090.0" y="1202.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">范围在执行中漂移。</text>
<rect x="1320.0" y="1120.0" width="280.0" height="110.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="1460.0" y="1157.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">4.7 汇总网络测试并发布证明</text>
<text x="1460.0" y="1180.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">发布本次范围可以支持哪些后续通信</text>
<text x="1460.0" y="1202.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">任务的证明。</text>
<rect x="1320.0" y="1290.0" width="280.0" height="110.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="1460.0" y="1327.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">5.8 评审报告与退出条件</text>
<text x="1460.0" y="1350.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">确认本次交付测试达标并完成调优清</text>
<text x="1460.0" y="1372.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">单确认。</text>
<rect x="410.0" y="1150.0" width="460.0" height="125.0" rx="12" fill="#FFFBEB" stroke="#c4bfd5"/>
<text x="640.0" y="1195.25" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">执行前刷新就绪证明</text>
<text x="640.0" y="1217.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">3.3 接线核验与 4.1 测试准入前刷新网络状态</text>
<text x="640.0" y="1240.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">默认有效期 30 秒；5.1 通信组预检再次核对</text>
<rect x="80.0" y="1360.0" width="780.0" height="100.0" rx="12" fill="#F8FAFC" stroke="#c4bfd5"/>
<text x="470.0" y="1404.0" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">阅读边界</text>
<text x="470.0" y="1426.5" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">1.8 验收导出不额外阻断装机或测试。5.8 报告评审通过，只解锁退出流程。</text>
<g><rect x="172.0" y="274.0" width="96" height="20" rx="4" fill="white" fill-opacity=".95"/><text x="220.0" y="288.0" text-anchor="middle" fill="#7560a8" font-size="12">物料与连接计划</text></g>
<g><rect x="202.0" y="414.0" width="36" height="20" rx="4" fill="white" fill-opacity=".95"/><text x="220.0" y="428.0" text-anchor="middle" fill="#7560a8" font-size="12">计划</text></g>
