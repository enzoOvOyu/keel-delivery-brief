<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1160" role="img" aria-label="0.2 CMDB 全过程数据流">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#7560a8"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#b07920"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<polyline points="450.0,245.0 460,245.0 460,460 540,460 540,465.0 560.0,465.0" fill="none" stroke="#7560a8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="450.0,445.0 460,445.0 460,440 540,440 540,465.0 560.0,465.0" fill="none" stroke="#7560a8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="450.0,645.0 460,645.0 460,640 540,640 540,465.0 560.0,465.0" fill="none" stroke="#7560a8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="450.0,845.0 460,845.0 460,460 540,460 540,465.0 560.0,465.0" fill="none" stroke="#7560a8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="725.0,780.0 725.0,760 780,760 780.0,550.0" fill="none" stroke="#7560a8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1000.0,465.0 1020,465.0 1020,460 1100,460 1100,465.0 1110.0,465.0" fill="none" stroke="#7560a8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="780.0,290.0 780.0,380.0" fill="none" stroke="#b07920" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#amber)" stroke-dasharray="7 5"/>
<polyline points="1000.0,465.0 1020,465.0 1020,850 1110.0,850.0" fill="none" stroke="#7560a8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="60.0" y="20.0" width="1500.0" height="100.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="810.0" y="64.0" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">0.2 CMDB：每条源记录独立消费，全程自动沉淀</text>
<text x="810.0" y="86.5" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">实线＝源记录发布后建立索引；虚线＝外部退出生命周期事件。没有等待五步齐备的全局门禁。</text>
<rect x="60.0" y="180.0" width="390.0" height="130.0" rx="12" fill="#EFF6FF" stroke="#c4bfd5"/>
<text x="255.0" y="239.0" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">1.1～1.8 网络底座</text>
<text x="255.0" y="261.5" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">物料／交换机身份／端口／配置／健康</text>
<rect x="60.0" y="380.0" width="390.0" height="130.0" rx="12" fill="#EFF6FF" stroke="#c4bfd5"/>
<text x="255.0" y="439.0" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">2.1 装机 · 2.2 硬件采集</text>
<text x="255.0" y="461.5" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">BMC 与 OS 分源；完整与缺失均留存</text>
<rect x="60.0" y="580.0" width="390.0" height="130.0" rx="12" fill="#EFF6FF" stroke="#c4bfd5"/>
<text x="255.0" y="639.0" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">3.1～3.5 验机与配置</text>
<text x="255.0" y="661.5" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">硬件／拓扑／双侧邻居／映射／配置</text>
<rect x="60.0" y="780.0" width="390.0" height="130.0" rx="12" fill="#EFF6FF" stroke="#c4bfd5"/>
<text x="255.0" y="839.0" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">4.1～4.7 与 5.1～5.8 测试</text>
<text x="255.0" y="861.5" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">计划／原始结果／指标／报告／评审</text>
<rect x="530.0" y="780.0" width="390.0" height="130.0" rx="12" fill="#EFF6FF" stroke="#c4bfd5"/>
<text x="725.0" y="839.0" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">0.1 修复；持续观测与人工确认</text>
<text x="725.0" y="861.5" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">处置记录／窗口／就绪／确认记录</text>
<rect x="560.0" y="380.0" width="440.0" height="170.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="780.0" y="447.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">0.2 CMDB 自动沉淀与维护查询</text>
<text x="780.0" y="470.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">每次源记录发布即更新资产索引；把五步数据连成设备档案，</text>
<text x="780.0" y="492.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">供维护查询。</text>
<rect x="1110.0" y="380.0" width="420.0" height="170.0" rx="12" fill="#F3F0FF" stroke="#c4bfd5"/>
<text x="1320.0" y="447.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">设备 360°／项目查询／API 导出</text>
<text x="1320.0" y="470.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">按设备、端口、版本追到原始证据</text>
<text x="1320.0" y="492.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">当前可用性与历史结论分别展示</text>
<rect x="560.0" y="160.0" width="440.0" height="130.0" rx="12" fill="#FFFBEB" stroke="#c4bfd5"/>
<text x="780.0" y="207.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">外部：退出清理已核验</text>
<text x="780.0" y="230.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">5.8 评审通过仅允许开始退出</text>
<text x="780.0" y="252.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">清理回执确认后才转维护态</text>
<rect x="1110.0" y="780.0" width="420.0" height="140.0" rx="12" fill="#FFFBEB" stroke="#c4bfd5"/>
<text x="1320.0" y="832.75" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">同步失败 → 对账并重放原事件</text>
<text x="1320.0" y="855.25" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">重复不重复建档；迟到不覆盖新版</text>
<text x="1320.0" y="877.75" text-anchor="middle" font-size="15" font-weight="400" fill="#25223d">自动字段与人工维保字段分列保存</text>
<rect x="60.0" y="990.0" width="1470.0" height="100.0" rx="12" fill="#F8FAFC" stroke="#c4bfd5"/>
<text x="795.0" y="1045.25" text-anchor="middle" font-size="15" font-weight="650" fill="#25223d">展开范围：所有流程的全部产物，加主机／交换机观测、负载窗口、动态就绪与人工确认。指标明细仍在源表／证据存储，CMDB 保存索引。</text>
