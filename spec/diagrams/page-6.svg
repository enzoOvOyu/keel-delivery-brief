<g><rect x="464.0" y="461.0" width="72" height="20" rx="4" fill="white" fill-opacity=".95"/><text x="500.0" y="475.0" text-anchor="middle" fill="#7560a8" font-size="12">源记录引用</text></g>
<g><rect x="744.0" y="644.0" width="72" height="20" rx="4" fill="white" fill-opacity=".95"/><text x="780.0" y="658.0" text-anchor="middle" fill="#7560a8" font-size="12">源记录引用</text></g>
<path d="M1060.0 460.0 L1060.0 364.0" fill="none" stroke="#7560a8" stroke-width=".8" stroke-dasharray="2 3"/>
<g><rect x="1012.0" y="353.0" width="96" height="20" rx="4" fill="white" fill-opacity=".95"/><text x="1060.0" y="367.0" text-anchor="middle" fill="#7560a8" font-size="12">索引与质量状态</text></g>
<g><rect x="738.0" y="324.0" width="84" height="20" rx="4" fill="white" fill-opacity=".95"/><text x="780.0" y="338.0" text-anchor="middle" fill="#b07920" font-size="12">归档清单事件</text></g>
<g><rect x="990.0" y="646.5" width="60" height="20" rx="4" fill="white" fill-opacity=".95"/><text x="1020.0" y="660.5" text-anchor="middle" fill="#7560a8" font-size="12">逐项回执</text></g>
</g></svg>